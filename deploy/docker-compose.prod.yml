# 生产部署编排：复用服务器原生 MySQL/MongoDB/Redis，仅容器化 backend + nginx（host 网络）
services:
  backend:
    build: ../backend
    container_name: inkwell-backend
    network_mode: host
    restart: always
    env_file: .env
    volumes:
      - upload_data:/app/uploads

  frontend:
    image: nginx:alpine
    container_name: inkwell-frontend
    network_mode: host
    restart: always
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  upload_data:
